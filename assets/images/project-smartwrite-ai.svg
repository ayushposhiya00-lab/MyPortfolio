<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="swBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="50%" stop-color="#0B0D13"/>
      <stop offset="100%" stop-color="#161226"/>
    </linearGradient>

    <linearGradient id="swCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2435" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#141824" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="swGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#swBgGrad)"/>
  <circle cx="200" cy="120" r="150" fill="#8B5CF6" opacity="0.08" filter="url(#swGlow)"/>
  <circle cx="650" cy="320" r="160" fill="#A78BFA" opacity="0.07" filter="url(#swGlow)"/>

  <!-- Top App Navigation Bar -->
  <rect x="25" y="20" width="750" height="46" rx="10" fill="url(#swCardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="45" cy="43" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="62" cy="43" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="79" cy="43" r="5" fill="#10B981" opacity="0.8"/>
  
  <text x="105" y="48" fill="#F8FAFC" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="0.5">SMARTWRITE — MULTILINGUAL AI GRAMMAR CHECKER</text>
  
  <rect x="495" y="30" width="140" height="26" rx="6" fill="#8B5CF6" fill-opacity="0.15" stroke="#A78BFA" stroke-opacity="0.3"/>
  <text x="565" y="47" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="middle">ENGLISH &amp; GUJARATI</text>

  <rect x="645" y="30" width="115" height="26" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="702" y="47" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">● GROQ / OPENAI</text>

  <!-- Left Card: Original Input & Error Detection -->
  <g transform="translate(25, 80)">
    <rect width="365" height="345" rx="12" fill="url(#swCardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    
    <text x="20" y="30" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13">Raw Text Analysis</text>
    <rect x="250" y="16" width="95" height="20" rx="4" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-opacity="0.3"/>
    <text x="297" y="30" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">3 ISSUES FOUND</text>

    <!-- English input box -->
    <rect x="20" y="48" width="325" height="110" rx="8" fill="#141926" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="32" y="70" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">// Language: English (US)</text>
    <text x="32" y="92" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">The model <tspan fill="#F87171" text-decoration="underline" font-weight="600">give</tspan> accurate predictions</text>
    <text x="32" y="112" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">and <tspan fill="#F87171" text-decoration="underline" font-weight="600">its</tspan> able to detect anomalies</text>
    <text x="32" y="132" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12">with <tspan fill="#F87171" text-decoration="underline" font-weight="600">to much</tspan> low latency.</text>

    <!-- Gujarati input box -->
    <rect x="20" y="170" width="325" height="100" rx="8" fill="#141926" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="32" y="192" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">// Language: Gujarati (ગુજરાતી)</text>
    <text x="32" y="218" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12.5">આ સિસ્ટમ ડેટા <tspan fill="#F87171" text-decoration="underline" font-weight="600">વિશ્લેસણ</tspan> કરે છે</text>
    <text x="32" y="240" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12.5">અને પરિણામો સચોટ <tspan fill="#F87171" text-decoration="underline" font-weight="600">બતાવે</tspan> છે.</text>

    <!-- Bottom Diagnostic Tag -->
    <g transform="translate(20, 285)">
      <rect width="325" height="42" rx="8" fill="#1A1F30" stroke="#8B5CF6" stroke-opacity="0.2"/>
      <circle cx="20" cy="21" r="8" fill="#8B5CF6" fill-opacity="0.25"/>
      <text x="20" y="25" fill="#C4B5FD" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">i</text>
      <text x="38" y="25" fill="#C4B5FD" font-family="'Inter', sans-serif" font-size="10.5">Tokenizer: Byte-Pair Encoding · 48ms Inference</text>
    </g>
  </g>

  <!-- Right Card: Refined LLM Output & Explanations -->
  <g transform="translate(410, 80)">
    <rect width="365" height="345" rx="12" fill="url(#swCardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    
    <text x="20" y="30" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13">LLM Refinement &amp; Corrections</text>
    <rect x="250" y="16" width="95" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="297" y="30" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">✓ POLISHED</text>

    <!-- English refined box -->
    <rect x="20" y="48" width="325" height="110" rx="8" fill="#161C2C" stroke="#8B5CF6" stroke-opacity="0.25"/>
    <text x="32" y="70" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10">// Refined English (99.4% fluency)</text>
    <text x="32" y="92" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12">The model <tspan fill="#34D399" font-weight="600">gives</tspan> accurate predictions</text>
    <text x="32" y="112" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12">and <tspan fill="#34D399" font-weight="600">it is</tspan> able to detect anomalies</text>
    <text x="32" y="132" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12">with <tspan fill="#34D399" font-weight="600">exceptionally</tspan> low latency.</text>

    <!-- Gujarati refined box -->
    <rect x="20" y="170" width="325" height="100" rx="8" fill="#161C2C" stroke="#8B5CF6" stroke-opacity="0.25"/>
    <text x="32" y="192" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10">// સુધારેલ ગુજરાતી (શુદ્ધ વ્યાકરણ)</text>
    <text x="32" y="218" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12.5">આ સિસ્ટમ ડેટાનું <tspan fill="#34D399" font-weight="600">વિશ્લેષણ</tspan> કરે છે</text>
    <text x="32" y="240" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12.5">અને પરિણામો અત્યંત સચોટ <tspan fill="#34D399" font-weight="600">દર્શાવે</tspan> છે.</text>

    <!-- Full-stack Badge Container -->
    <g transform="translate(20, 285)">
      <rect width="325" height="42" rx="8" fill="#1A1F30" stroke="#8B5CF6" stroke-opacity="0.2"/>
      <text x="162" y="25" fill="#DDD6FE" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Flask Backend · Groq Llama 3 · Real-time Diff</text>
    </g>
  </g>
</svg>

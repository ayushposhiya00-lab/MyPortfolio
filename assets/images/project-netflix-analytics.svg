<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="50%" stop-color="#0B0D13"/>
      <stop offset="100%" stop-color="#141124"/>
    </linearGradient>
    
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.9"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2435" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#141824" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filter for subtle glass glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle ambient glow circles -->
  <circle cx="150" cy="100" r="140" fill="#8B5CF6" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="680" cy="350" r="160" fill="#6366F1" opacity="0.07" filter="url(#softGlow)"/>

  <!-- Top App Navigation Bar -->
  <rect x="25" y="20" width="750" height="46" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="45" cy="43" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="62" cy="43" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="79" cy="43" r="5" fill="#10B981" opacity="0.8"/>
  
  <text x="105" y="48" fill="#F8FAFC" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="0.5">NETFLIX CONTENT ANALYTICS &amp; RECOMMENDER</text>
  <rect x="530" y="30" width="130" height="26" rx="6" fill="#8B5CF6" fill-opacity="0.15" stroke="#A78BFA" stroke-opacity="0.3"/>
  <text x="595" y="47" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="middle">8,807 TITLES EDA</text>

  <rect x="670" y="30" width="90" height="26" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="715" y="47" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">● STREAMLIT</text>

  <!-- Left Card: EDA & Genre Distribution -->
  <g transform="translate(25, 80)">
    <rect width="365" height="345" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    
    <text x="20" y="30" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13">Catalog Distribution by Genre</text>
    <text x="20" y="48" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">TF-IDF Vector Space Analysis</text>

    <!-- Bar Chart -->
    <g transform="translate(20, 75)">
      <!-- Item 1: International Movies -->
      <text x="0" y="14" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">International Movies</text>
      <text x="325" y="14" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">2,752</text>
      <rect x="0" y="22" width="325" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="22" width="280" height="10" rx="5" fill="url(#barGrad1)"/>

      <!-- Item 2: Dramas -->
      <text x="0" y="56" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">Dramas &amp; Independent</text>
      <text x="325" y="56" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">2,427</text>
      <rect x="0" y="64" width="325" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="64" width="245" height="10" rx="5" fill="url(#barGrad1)"/>

      <!-- Item 3: Comedies -->
      <text x="0" y="98" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">Comedies &amp; Stand-Up</text>
      <text x="325" y="98" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">1,674</text>
      <rect x="0" y="106" width="325" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="106" width="175" height="10" rx="5" fill="url(#barGrad2)"/>

      <!-- Item 4: Documentaries -->
      <text x="0" y="140" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">Documentaries &amp; Docuseries</text>
      <text x="325" y="140" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">861</text>
      <rect x="0" y="148" width="325" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="148" width="105" height="10" rx="5" fill="url(#barGrad2)"/>

      <!-- Item 5: Action & Sci-Fi -->
      <text x="0" y="182" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">Action, Sci-Fi &amp; Fantasy</text>
      <text x="325" y="182" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">721</text>
      <rect x="0" y="190" width="325" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="190" width="85" height="10" rx="5" fill="url(#barGrad2)"/>
    </g>

    <!-- Bottom KPI Pills -->
    <g transform="translate(20, 290)">
      <rect x="0" y="0" width="100" height="36" rx="8" fill="#181D2D" stroke="#8B5CF6" stroke-opacity="0.2"/>
      <text x="50" y="16" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">TOTAL TITLES</text>
      <text x="50" y="30" fill="#A78BFA" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">8,807</text>

      <rect x="112" y="0" width="100" height="36" rx="8" fill="#181D2D" stroke="#8B5CF6" stroke-opacity="0.2"/>
      <text x="162" y="16" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">TV / MOVIES</text>
      <text x="162" y="30" fill="#C4B5FD" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">30% / 70%</text>

      <rect x="224" y="0" width="101" height="36" rx="8" fill="#181D2D" stroke="#8B5CF6" stroke-opacity="0.2"/>
      <text x="274" y="16" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">TF-IDF VOCAB</text>
      <text x="274" y="30" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">12,450+</text>
    </g>
  </g>

  <!-- Right Card: Content Recommender Engine -->
  <g transform="translate(410, 80)">
    <rect width="365" height="345" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    
    <text x="20" y="30" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13">Cosine Similarity Engine</text>
    <text x="20" y="48" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Query: "Sci-Fi · Mind-Bending · Time Distortion"</text>

    <!-- Query Match Input Box -->
    <rect x="20" y="62" width="325" height="38" rx="8" fill="#141926" stroke="#8B5CF6" stroke-opacity="0.3"/>
    <text x="35" y="85" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11.5">🎬 Input: <tspan fill="#C4B5FD" font-weight="600">Interstellar (2014)</tspan></text>
    <rect x="250" y="70" width="85" height="22" rx="5" fill="#7C3AED" fill-opacity="0.3"/>
    <text x="292" y="85" fill="#E0E7FF" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">TOP 3 MATCH</text>

    <!-- Recommendation Result 1 -->
    <g transform="translate(20, 115)">
      <rect width="325" height="62" rx="8" fill="#191F30" stroke="#A78BFA" stroke-opacity="0.25"/>
      <circle cx="25" cy="31" r="14" fill="#7C3AED" fill-opacity="0.2"/>
      <text x="25" y="35" fill="#C4B5FD" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <text x="50" y="26" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Inception</text>
      <text x="50" y="44" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Sci-Fi, Psychological Thriller · Dir. Christopher Nolan</text>
      <rect x="250" y="16" width="65" height="28" rx="6" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-opacity="0.4"/>
      <text x="282" y="34" fill="#DDD6FE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">98.2%</text>
    </g>

    <!-- Recommendation Result 2 -->
    <g transform="translate(20, 185)">
      <rect width="325" height="62" rx="8" fill="#161B2B" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="25" cy="31" r="14" fill="#6366F1" fill-opacity="0.15"/>
      <text x="25" y="35" fill="#A5B4FC" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <text x="50" y="26" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="12">The Matrix</text>
      <text x="50" y="44" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Sci-Fi, Cyberpunk, Artificial Intelligence</text>
      <rect x="250" y="16" width="65" height="28" rx="6" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.3"/>
      <text x="282" y="34" fill="#C7D2FE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">94.7%</text>
    </g>

    <!-- Recommendation Result 3 -->
    <g transform="translate(20, 255)">
      <rect width="325" height="62" rx="8" fill="#161B2B" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="25" cy="31" r="14" fill="#6366F1" fill-opacity="0.15"/>
      <text x="25" y="35" fill="#A5B4FC" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <text x="50" y="26" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Dark (Series)</text>
      <text x="50" y="44" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Time Travel, Mystery, Quantum Paradoxes</text>
      <rect x="250" y="16" width="65" height="28" rx="6" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.3"/>
      <text x="282" y="34" fill="#C7D2FE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">92.1%</text>
    </g>
  </g>
</svg>
